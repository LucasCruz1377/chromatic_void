name: CI - Verificar Chromatic Void

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  exportar:
    name: Importar e exportar o jogo
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Exportar com Godot
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          cache: true

      - name: Guardar builds de teste
        uses: actions/upload-artifact@v4
        with:
          name: Chromatic-Void-builds
          path: ${{ steps.export.outputs.archive_directory }}
          retention-days: 7