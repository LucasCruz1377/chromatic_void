name: CI - Validar Chromatic Void

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

  schedule:
    # Segunda-feira, 09:00 no horário de Brasília.
    - cron: "0 12 * * 1"

  workflow_dispatch:
    inputs:
      gerar_builds:
        description: "Gerar também os builds de Windows e Web"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Importar e executar smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Instalar Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Confirmar versão do Godot
        run: godot --version

      - name: Verificar referências de recursos
        run: python3 Tests/validar_referencias.py

      - name: Importar projeto em modo headless
        run: godot --headless --audio-driver Dummy --path . --import --quit

      - name: Executar smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t testes < <(find Tests -maxdepth 1 -name '*_smoke.tscn' -print | sort)
          if [[ ${#testes[@]} -eq 0 ]]; then
            echo "Nenhum smoke test foi encontrado."
            exit 1
          fi

          for teste in "${testes[@]}"; do
            echo "Executando $teste"
            timeout 180s godot \
              --headless \
              --audio-driver Dummy \
              --path . \
              "res://$teste"
          done

  exportar:
    name: Exportar ${{ matrix.nome }}
    needs: validar
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.gerar_builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Windows Desktop
            nome: Windows
            artefato: windows
          - preset: Web
            nome: Web
            artefato: web

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Exportar ${{ matrix.nome }} com Godot
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: ${{ matrix.preset }}
          archive_output: true
          cache: true

      - name: Guardar build de ${{ matrix.nome }}
        uses: actions/upload-artifact@v4
        with:
          name: Chromatic-Void-${{ matrix.artefato }}
          path: ${{ steps.export.outputs.archive_directory }}
          if-no-files-found: error
          retention-days: 7
