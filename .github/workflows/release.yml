name: CD - Publicar Chromatic Void

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente que será publicada. Exemplo: v0.6.0-beta.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preparar:
    name: Validar tag e projeto
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      tag: ${{ steps.versao.outputs.tag }}
      prerelease: ${{ steps.versao.outputs.prerelease }}

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Classificar versão
        id: versao
        shell: bash
        env:
          TAG_INFORMADA: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_INFORMADA" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Tag inválida: $TAG_INFORMADA"
            echo "Use:"
            echo "vX.Y.Z"
            echo "vX.Y.Z-alpha.N"
            echo "vX.Y.Z-beta.N"
            echo "vX.Y.Z-rc.N"
            exit 1
          fi

          echo "tag=$TAG_INFORMADA" >> "$GITHUB_OUTPUT"

          if [[ "$TAG_INFORMADA" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Confirmar versão do Godot
        run: godot --version

      - name: Verificar referências de recursos
        run: python3 Tests/validar_referencias.py

      - name: Verificar catálogo, loja e feedback de combate
        run: |
          python3 Tests/validar_monthly_catalogo.py
          python3 Tests/validar_polimento_loja_dano.py

      - name: Importar projeto em modo headless
        run: godot --headless --audio-driver Dummy --path . --import --quit

      - name: Executar smoke tests
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t testes < <(find Tests -maxdepth 1 -name '*_smoke.tscn' -print | sort)

          if [[ ${#testes[@]} -eq 0 ]]; then
            echo "Nenhum smoke test foi encontrado."
            exit 1
          fi

          for teste in "${testes[@]}"; do
            echo "Executando $teste"

            timeout 180s godot \
              --headless \
              --audio-driver Dummy \
              --path . \
              "res://$teste"
          done


  exportar:
    name: Exportar ${{ matrix.nome }}
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        include:

          - preset: Windows Desktop
            nome: Windows
            artefato: windows
            android: false

          - preset: Web
            nome: Web
            artefato: web
            android: false

          - preset: Android APK
            nome: Android APK
            artefato: android
            android: true

    steps:
      - name: Baixar a versão da tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preparar.outputs.tag }}
          fetch-depth: 0


      # ==========================================================
      # VERSÃO
      # ==========================================================

      - name: Aplicar versão da tag aos executáveis
        env:
          TAG: ${{ needs.preparar.outputs.tag }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail

          python3 Tests/aplicar_versao_release.py \
            "$TAG" \
            "$VERSION_CODE"


      # ==========================================================
      # ANDROID
      # ==========================================================

      - name: Preparar Java 17 para Android
        if: matrix.android == true && vars.ANDROID_RELEASE_ENABLED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Preparar Android SDK
        if: matrix.android == true && vars.ANDROID_RELEASE_ENABLED == 'true'
        uses: android-actions/setup-android@v4


      - name: Instalar componentes Android
        if: matrix.android == true && vars.ANDROID_RELEASE_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35"


      # ==========================================================
      # RESTAURAR KEYSTORE
      # ==========================================================

      - name: Restaurar keystore Android
        if: matrix.android == true && vars.ANDROID_RELEASE_ENABLED == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "ERRO: ANDROID_KEYSTORE_BASE64 não está configurado."
            exit 1
          fi

          if [[ -z "${ANDROID_KEY_ALIAS:-}" ]]; then
            echo "ERRO: ANDROID_KEY_ALIAS não está configurado."
            exit 1
          fi

          if [[ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]]; then
            echo "ERRO: ANDROID_KEYSTORE_PASSWORD não está configurado."
            exit 1
          fi

          KEYSTORE_DIR="${RUNNER_TEMP}/android-signing"
          KEYSTORE_PATH="${KEYSTORE_DIR}/chromatic-void.keystore"

          mkdir -p "$KEYSTORE_DIR"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "ERRO: a keystore foi criada vazia."
            exit 1
          fi

          echo "Keystore restaurada com sucesso."


      # ==========================================================
      # VALIDAR KEYSTORE
      # ==========================================================

      - name: Validar assinatura Android
        if: matrix.android == true && vars.ANDROID_RELEASE_ENABLED == 'true'
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="${RUNNER_TEMP}/android-signing/chromatic-void.keystore"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "=========================================="
          echo "KEYSTORE VALIDADA"
          echo "=========================================="
          echo "Alias encontrado e chave válida."


      # ==========================================================
      # EXPORTAR
      # ==========================================================

      - name: Exportar ${{ matrix.nome }} com Godot
        if: matrix.android != true || vars.ANDROID_RELEASE_ENABLED == 'true'
        id: export
        uses: firebelley/godot-export@v8.0.0

        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/android-signing/chromatic-void.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: ${{ matrix.preset }}
          export_debug: false
          archive_output: true
          cache: true


      # ==========================================================
      # VERIFICAR APK
      # ==========================================================

      - name: Localizar APK Android
        if: matrix.android == true && vars.ANDROID_RELEASE_ENABLED == 'true'
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find "${{ steps.export.outputs.build_directory }}" \
            -type f \
            -name '*.apk' \
            -print \
            -quit)"

          if [[ -z "$APK_PATH" ]]; then
            echo "ERRO: nenhum APK foi encontrado."
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

          echo "APK encontrado:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"


      # ==========================================================
      # VERIFICAR ASSINATURA DO APK
      # ==========================================================

      - name: Verificar assinatura do APK
        if: matrix.android == true && vars.ANDROID_RELEASE_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.apk_path }}"

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools"

          APKSIGNER="$(find "$BUILD_TOOLS_DIR" \
            -type f \
            -name apksigner \
            -print \
            | sort \
            | tail -n 1)"

          if [[ -z "$APKSIGNER" ]]; then
            echo "ERRO: apksigner não encontrado."
            exit 1
          fi

          echo "=========================================="
          echo "VERIFICANDO ASSINATURA DO APK"
          echo "=========================================="

          "$APKSIGNER" verify --verbose "$APK"

          echo "=========================================="
          echo "APK ASSINADO E VALIDADO"
          echo "=========================================="


      # ==========================================================
      # ARTEFATOS
      # ==========================================================

      - name: Guardar build para publicação
        if: matrix.android != true
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artefato }}
          path: ${{ steps.export.outputs.archive_directory }}
          if-no-files-found: error
          retention-days: 7


      - name: Guardar APK para publicação
        if: matrix.android == true && vars.ANDROID_RELEASE_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 7


  publicar:
    name: Criar GitHub Release
    needs:
      - preparar
      - exportar

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o repositório na tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preparar.outputs.tag }}
          fetch-depth: 0


      - name: Baixar builds aprovados
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true


      - name: Organizar arquivos e gerar checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          while IFS= read -r -d '' arquivo; do

            destino="release-assets/$(basename "$arquivo")"

            if [[ -e "$destino" ]]; then
              echo "ERRO: dois builds possuem o mesmo nome:"
              echo "$destino"
              exit 1
            fi

            cp "$arquivo" "$destino"

          done < <(find dist -type f -print0)

          if [[ -z "$(find release-assets -maxdepth 1 -type f -print -quit)" ]]; then
            echo "ERRO: nenhum build foi encontrado."
            exit 1
          fi

          echo "=========================================="
          echo "ARQUIVOS DA RELEASE"
          echo "=========================================="

          ls -lh release-assets

          cd release-assets

          sha256sum ./* > SHA256SUMS.txt


      # ==========================================================
      # RELEASE ESTÁVEL
      # ==========================================================

      - name: Criar Release estável
        if: needs.preparar.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preparar.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG" release-assets/* \
            --title "Chromatic Void $TAG" \
            --generate-notes \
            --verify-tag \
            --latest


      # ==========================================================
      # PRÉ-RELEASE
      # ==========================================================

      - name: Criar pré-lançamento
        if: needs.preparar.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preparar.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG" release-assets/* \
            --title "Chromatic Void $TAG" \
            --generate-notes \
            --verify-tag \
            --prerelease \
            --latest=false