name: CD - Publicar Chromatic Void

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente que será publicada, por exemplo v0.6.0-beta.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preparar:
    name: Validar tag e projeto
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.versao.outputs.tag }}
      prerelease: ${{ steps.versao.outputs.prerelease }}

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Classificar versão
        id: versao
        shell: bash
        env:
          TAG_INFORMADA: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_INFORMADA" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Tag inválida: $TAG_INFORMADA"
            echo "Use vX.Y.Z, vX.Y.Z-alpha.N, vX.Y.Z-beta.N ou vX.Y.Z-rc.N."
            exit 1
          fi

          echo "tag=$TAG_INFORMADA" >> "$GITHUB_OUTPUT"
          if [[ "$TAG_INFORMADA" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Verificar referências de recursos
        run: python3 Tests/validar_referencias.py

      - name: Importar projeto em modo headless
        run: godot --headless --audio-driver Dummy --path . --import --quit

      - name: Executar smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t testes < <(find Tests -maxdepth 1 -name '*_smoke.tscn' -print | sort)
          if [[ ${#testes[@]} -eq 0 ]]; then
            echo "Nenhum smoke test foi encontrado."
            exit 1
          fi

          for teste in "${testes[@]}"; do
            echo "Executando $teste"
            timeout 180s godot \
              --headless \
              --audio-driver Dummy \
              --path . \
              "res://$teste"
          done

  exportar:
    name: Exportar ${{ matrix.nome }}
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Windows Desktop
            nome: Windows
            artefato: windows
          - preset: Web
            nome: Web
            artefato: web

    steps:
      - name: Baixar a versão da tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preparar.outputs.tag }}

      - name: Exportar ${{ matrix.nome }} com Godot
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: ${{ matrix.preset }}
          archive_output: true
          cache: true

      - name: Guardar build para publicação
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artefato }}
          path: ${{ steps.export.outputs.archive_directory }}
          if-no-files-found: error
          retention-days: 7

  publicar:
    name: Criar GitHub Release
    needs:
      - preparar
      - exportar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório na tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preparar.outputs.tag }}
          fetch-depth: 0

      - name: Baixar builds aprovados
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Organizar arquivos e gerar checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' arquivo; do
            destino="release-assets/$(basename "$arquivo")"
            if [[ -e "$destino" ]]; then
              echo "Dois builds geraram o mesmo nome: $destino"
              exit 1
            fi
            cp "$arquivo" "$destino"
          done < <(find dist -type f -print0)

          if [[ -z "$(find release-assets -maxdepth 1 -type f -print -quit)" ]]; then
            echo "Nenhum build foi baixado para a Release."
            exit 1
          fi

          cd release-assets
          sha256sum ./* > SHA256SUMS.txt

      - name: Criar Release estável
        if: needs.preparar.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preparar.outputs.tag }}
        run: |
          gh release create "$TAG" release-assets/* \
            --title "Chromatic Void $TAG" \
            --generate-notes \
            --verify-tag \
            --latest

      - name: Criar pré-lançamento
        if: needs.preparar.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preparar.outputs.tag }}
        run: |
          gh release create "$TAG" release-assets/* \
            --title "Chromatic Void $TAG" \
            --generate-notes \
            --verify-tag \
            --prerelease \
            --latest=false
