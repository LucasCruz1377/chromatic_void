name: CD - Publicar no itch.io

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da Release. Deixe vazio para usar a Release mais recente."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: itchio-publish
  cancel-in-progress: false

env:
  ITCHIO_GAME: lukass-1377/chromatic-void

jobs:
  publicar:
    name: Publicar no itch.io
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ==========================================================
      # 1. INSTALAR BUTLER
      # ==========================================================

      - name: Instalar Butler
        uses: remarkablegames/setup-butler@v3
        with:
          butler-version: LATEST

      - name: Verificar Butler
        run: |
          set -euo pipefail
          butler --version


      # ==========================================================
      # 2. ENCONTRAR RELEASE
      # ==========================================================

      - name: Encontrar Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INFORMADA: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$TAG_INFORMADA" ]]; then

            TAG="$TAG_INFORMADA"

            echo "Release informada manualmente:"
            echo "$TAG"

          else

            echo "Procurando a Release mais recente..."
            echo "Pre-releases também serão consideradas."

            TAG=$(gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100 \
              --exclude-drafts \
              --json tagName,publishedAt,isPrerelease \
              --jq 'sort_by(.publishedAt) | reverse | .[0].tagName')

            if [[ -z "$TAG" || "$TAG" == "null" ]]; then
              echo "ERRO: nenhuma Release encontrada."
              exit 1
            fi

            echo "Release encontrada:"
            echo "$TAG"

          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 3. MOSTRAR RELEASE
      # ==========================================================

      - name: Mostrar Release selecionada
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RELEASE SELECIONADA"
          echo "=========================================="

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isPrerelease,publishedAt

          echo "=========================================="


      # ==========================================================
      # 4. BAIXAR WINDOWS
      # ==========================================================

      - name: Baixar Windows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloads/windows

          echo "=========================================="
          echo "BAIXANDO WINDOWS"
          echo "=========================================="

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Windows.Desktop.zip" \
            --dir downloads/windows

          echo ""
          echo "Arquivos baixados:"

          ls -lah downloads/windows

          if [[ ! -f "downloads/windows/Windows.Desktop.zip" ]]; then
            echo ""
            echo "ERRO:"
            echo "Windows.Desktop.zip não foi encontrado na Release."
            exit 1
          fi


      # ==========================================================
      # 5. BAIXAR ANDROID
      # ==========================================================

      - name: Baixar Android
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloads/android

          echo "=========================================="
          echo "BAIXANDO ANDROID"
          echo "=========================================="

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ChromaticVoid-Android.apk" \
            --dir downloads/android

          echo ""
          echo "Arquivos baixados:"

          ls -lah downloads/android

          if [[ ! -f "downloads/android/ChromaticVoid-Android.apk" ]]; then
            echo ""
            echo "ERRO:"
            echo "ChromaticVoid-Android.apk não foi encontrado na Release."
            exit 1
          fi


      # ==========================================================
      # 6. PUBLICAR WINDOWS
      # ==========================================================

      - name: Publicar Windows no itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PUBLICANDO WINDOWS"
          echo "=========================================="

          echo "Release: $TAG"
          echo "Arquivo: Windows.Desktop.zip"
          echo "Canal: windows"
          echo "Destino: $ITCHIO_GAME:windows"

          echo "=========================================="

          butler push \
            "downloads/windows/Windows.Desktop.zip" \
            "$ITCHIO_GAME:windows" \
            --userversion "$TAG" \
            --if-changed


      # ==========================================================
      # 7. PUBLICAR ANDROID
      # ==========================================================

      - name: Publicar Android no itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PUBLICANDO ANDROID"
          echo "=========================================="

          echo "Release: $TAG"
          echo "Arquivo: ChromaticVoid-Android.apk"
          echo "Canal: android"
          echo "Destino: $ITCHIO_GAME:android"

          echo "=========================================="

          butler push \
            "downloads/android/ChromaticVoid-Android.apk" \
            "$ITCHIO_GAME:android" \
            --userversion "$TAG" \
            --if-changed


      # ==========================================================
      # 8. FINAL
      # ==========================================================

      - name: Publicação concluída
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo ""
          echo "=========================================="
          echo "PUBLICAÇÃO CONCLUÍDA"
          echo "=========================================="
          echo "Release: $TAG"
          echo "Windows: $ITCHIO_GAME:windows"
          echo "Android: $ITCHIO_GAME:android"
          echo "=========================================="