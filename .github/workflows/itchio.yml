name: CD - Publicar no itch.io

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da Release. Deixe vazio para usar a Release mais recente."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: itchio-publish
  cancel-in-progress: false

env:
  ITCHIO_GAME: lukass-1377/chromatic-void

jobs:
  publicar:
    name: Publicar Release no itch.io
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # 1. Instalar Butler
      # ============================================================

      - name: Instalar Butler
        uses: jdno/setup-butler@v2

      - name: Verificar Butler
        run: butler --version

      # ============================================================
      # 2. Descobrir a Release
      # ============================================================

      - name: Encontrar Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
            echo "Release escolhida manualmente: $TAG"
          else
            TAG=$(gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100 \
              --order desc \
              --exclude-drafts \
              --json tagName,publishedAt \
              --jq '.[0].tagName')

            if [[ -z "$TAG" ]]; then
              echo "ERRO: nenhuma Release encontrada."
              exit 1
            fi

            echo "Release mais recente encontrada: $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 3. Mostrar qual Release será publicada
      # ============================================================

      - name: Mostrar Release selecionada
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "=========================================="
          echo "Release selecionada: $TAG"
          echo "=========================================="

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isPrerelease,publishedAt,assets

      # ============================================================
      # 4. Baixar Windows
      # ============================================================

      - name: Baixar Windows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p downloads/windows

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Windows.Desktop.zip' \
            --dir downloads/windows

          echo "=========================================="
          echo "Asset Windows:"
          echo "=========================================="

          ls -lah downloads/windows

          if [[ ! -f "downloads/windows/Windows.Desktop.zip" ]]; then
            echo "ERRO: Windows.Desktop.zip não foi encontrado."
            exit 1
          fi

      # ============================================================
      # 5. Baixar Android
      # ============================================================

      - name: Baixar Android
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p downloads/android

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'ChromaticVoid-Android.apk' \
            --dir downloads/android

          echo "=========================================="
          echo "Asset Android:"
          echo "=========================================="

          ls -lah downloads/android

          if [[ ! -f "downloads/android/ChromaticVoid-Android.apk" ]]; then
            echo "ERRO: ChromaticVoid-Android.apk não foi encontrado."
            exit 1
          fi

      # ============================================================
      # 6. Publicar Windows
      # ============================================================

      - name: Publicar Windows no itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PUBLICANDO WINDOWS"
          echo "=========================================="
          echo "Release: $TAG"
          echo "Arquivo: Windows.Desktop.zip"
          echo "Destino: $ITCHIO_GAME:windows"
          echo "=========================================="

          butler push \
            --userversion "$TAG" \
            --if-changed \
            "downloads/windows/Windows.Desktop.zip" \
            "$ITCHIO_GAME:windows"

      # ============================================================
      # 7. Publicar Android
      # ============================================================

      - name: Publicar Android no itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PUBLICANDO ANDROID"
          echo "=========================================="
          echo "Release: $TAG"
          echo "Arquivo: ChromaticVoid-Android.apk"
          echo "Destino: $ITCHIO_GAME:android"
          echo "=========================================="

          butler push \
            --userversion "$TAG" \
            --if-changed \
            "downloads/android/ChromaticVoid-Android.apk" \
            "$ITCHIO_GAME:android"